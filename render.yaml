# Render blueprint. Vector-store strategy: option (a) — adipven_chroma_db/
# is committed to the repo (see .gitignore and the deployment summary), so
# the build step is just `pip install`; it does not run ingest_adipven.py.
#
# ANTHROPIC_API_KEY is intentionally NOT set here. `sync: false` means
# Render will prompt for it once in the dashboard and hold it as a secret
# env var — it never touches this file or the repo.
services:
  - type: web
    name: adipven-assistant-api
    runtime: python
    # Free plan. First deploy on free timed out during startup (see
    # deployment history) — logs show warmup starting and then nothing
    # further, consistent with either an OOM kill or the load simply
    # taking too long on a throttled free instance; the log alone doesn't
    # distinguish the two. Pursuing the torch-free ONNX embedding swap
    # (see THRESHOLD.md / deployment summary, Task 3) to cut resident
    # memory and load time before reconsidering a paid plan.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      # Keep the debug surface off by default in the deployed service.
      # Flip to "1" temporarily in the dashboard only if you need to
      # inspect `reasoning` / the grounding verdict remotely.
      - key: DEBUG_API
        value: "0"
