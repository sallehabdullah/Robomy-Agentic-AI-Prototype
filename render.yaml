# Render blueprint. Vector-store strategy: option (a) — adipven_chroma_db/
# is committed to the repo (see .gitignore and the deployment summary), so
# the build step is just `pip install`; it does not run ingest_adipven.py.
#
# ANTHROPIC_API_KEY is intentionally NOT set here. `sync: false` means
# Render will prompt for it once in the dashboard and hold it as a secret
# env var — it never touches this file or the repo.
services:
  - type: web
    name: adipven-assistant-api
    runtime: python
    # Free plan. First deploy on free timed out during startup (see
    # deployment history) — logs show warmup starting and then nothing
    # further, consistent with either an OOM kill or the load simply
    # taking too long on a throttled free instance; the log alone doesn't
    # distinguish the two. Pursuing the torch-free ONNX embedding swap
    # (see THRESHOLD.md / deployment summary, Task 3) to cut resident
    # memory and load time before reconsidering a paid plan.
    plan: free
    # The second command pre-fetches the ONNX encoder into
    # ~/.cache/chroma at BUILD time. Without it, the first request after
    # deploy pays a ~79MB download + SHA256 verify + tar extract + ONNX
    # session build, all inside the 512MB runtime budget and all before
    # the port opens — which is both a memory spike and a startup delay
    # that Render's port scanner can time out on. Build and runtime share
    # the instance filesystem, so a warm cache here means startup is just
    # a local file load.
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "from chromadb.utils.embedding_functions import ONNXMiniLM_L6_V2; ONNXMiniLM_L6_V2()(['warmup'])"
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # config.GENERATION_PROVIDER = "deepseek" — agent.get_llm() reads this
      # directly via os.environ["DEEPSEEK_API_KEY"] (no default), so a
      # deploy without it set in the dashboard fails on the first request,
      # not at build time. Same sync:false pattern as ANTHROPIC_API_KEY:
      # Render prompts for it once and holds it as a secret, never in this
      # file or the repo. ANTHROPIC_API_KEY is left declared above as the
      # rollback path — see config.GENERATION_PROVIDER's docstring.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      # Keep the debug surface off by default in the deployed service.
      # Flip to "1" temporarily in the dashboard only if you need to
      # inspect `reasoning` / the grounding verdict remotely.
      - key: DEBUG_API
        value: "0"
